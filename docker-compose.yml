version: '3.8'

services:
  # PostgreSQL (OLTP)
  postgres:
    image: postgres:16-alpine
    container_name: arcadia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: arcadia
      POSTGRES_PASSWORD: arcadia123
      POSTGRES_DB: arcadia_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./j_infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arcadia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcadia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse (OLAP)
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: arcadia-clickhouse
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      CLICKHOUSE_DB: arcadia
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./j_infrastructure/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - arcadia-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: arcadia-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass arcadia123
    volumes:
      - redis-data:/data
    networks:
      - arcadia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: arcadia-minio
    ports:
      - "9001:9001"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: arcadia-admin
      MINIO_ROOT_PASSWORD: arcadia-secret-key-123
    command: server /data --address ":9002" --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - arcadia-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: arcadia-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - arcadia-network

  # Kafka (Message Broker)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: arcadia-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - arcadia-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Airflow PostgreSQL Database
  airflow-db:
    image: postgres:16-alpine
    container_name: arcadia-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - arcadia-network

  # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.9.0-python3.11
    container_name: arcadia-airflow-webserver
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'arcadia-secret-key'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./h_airflow/dags:/opt/airflow/dags
      - ./h_airflow/logs:/opt/airflow/logs
      - ./h_airflow/plugins:/opt/airflow/plugins
      - airflow-data:/opt/airflow
    networks:
      - arcadia-network
    command: webserver

  # Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.9.0-python3.11
    container_name: arcadia-airflow-scheduler
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    volumes:
      - ./h_airflow/dags:/opt/airflow/dags
      - ./h_airflow/logs:/opt/airflow/logs
      - ./h_airflow/plugins:/opt/airflow/plugins
      - airflow-data:/opt/airflow
    networks:
      - arcadia-network
    command: scheduler

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: arcadia-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./j_infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - arcadia-network

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: arcadia-grafana
    depends_on:
      - prometheus
      - postgres
      - clickhouse
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ''
    volumes:
      - grafana-data:/var/lib/grafana
      - ./j_infrastructure/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - arcadia-network

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
  minio-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-data:
  airflow-db-data:
  airflow-data:
  prometheus-data:
  grafana-data:

networks:
  arcadia-network:
    driver: bridge
