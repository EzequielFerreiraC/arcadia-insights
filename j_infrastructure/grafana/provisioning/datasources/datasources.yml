apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"

  # PostgreSQL datasource
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: arcadia_db
    user: arcadia
    secureJsonData:
      password: arcadia123
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    editable: true

  # ClickHouse datasource (requires plugin)
  # - name: ClickHouse
  #   type: clickhouse
  #   access: proxy
  #   url: http://clickhouse:8123
  #   database: arcadia
  #   user: default
  #   editable: true
